name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so the badge reflects a build that still passes rather than one that passed
  # whenever someone last pushed.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  verify:
    name: Typecheck and rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck every workspace
        run: npm run lint

      # Pure checks — no server, no chain, no database file. Each suite pins one rule that was
      # previously wrong, so a regression fails the build rather than reaching production.
      - name: Rule checks
        run: npm run check

      - name: Build
        run: npm run build

      # Advisory, not blocking: a transitive advisory published overnight should not turn the
      # badge red on a commit that changed nothing. It surfaces in the log where someone reading
      # a run will see it, and Dependabot opens the PR that actually fixes it.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
